
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma carte Leaflet</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
    }

    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Ma carte interactive</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([34.261, -6.580], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    L.marker([34.261, -6.580])
      .addTo(map)
      .bindPopup('Bienvenue à Kénitra !')
      .openPopup();
    // Charger et afficher le fichier GeoJSON
    fetch('./grass.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Erreur lors du chargement du GeoJSON');
        }
        return response.json();
      })
      .then(data => {
        const coucheGeoJSON = L.geoJSON(data, {
          style: {
            color: 'blue',
            weight: 2,
            fillOpacity: 0.3
          },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              layer.bindPopup(
                Object.entries(feature.properties)
                  .map(([cle, valeur]) => `<b>${cle}</b> : ${valeur}`)
                  .join('<br>')
              );
            }
          }
        }).addTo(map);

        if (coucheGeoJSON.getLayers().length > 0) {
          map.fitBounds(coucheGeoJSON.getBounds());
        }
      })
      .catch(error => console.error(error));
  </script>
</body>
</html>
