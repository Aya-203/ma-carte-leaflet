
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte interactive de Rabat</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      padding: 15px;
      margin: 0;
      background-color: #f2f2f2;
    }

    #map {
      height: 85vh;
      width: 100%;
    }
  </style>
</head>

<body>

  <h1>Carte interactive de Rabat</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialiser la carte sur Rabat
    const map = L.map('map').setView([34.0209, -6.8416], 13);

    // Ajouter le fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Ajouter un marqueur sur Rabat
    L.marker([34.0209, -6.8416])
      .addTo(map)
      .bindPopup('Bienvenue à Rabat !')
      .openPopup();

    // Charger le fichier GeoJSON
    fetch('./grass.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Impossible de charger le fichier GeoJSON : ' + response.status);
        }
        return response.json();
      })
      .then(data => {
        const coucheGeoJSON = L.geoJSON(data, {
          style: {
            color: 'blue',
            weight: 2,
            fillOpacity: 0.3
          },
          onEachFeature: (feature, layer) => {
            if (feature.properties) {
              const contenu = Object.entries(feature.properties)
                .map(([cle, valeur]) => `<b>${cle}</b> : ${valeur}`)
                .join('<br>');

              layer.bindPopup(contenu || 'Aucune propriété disponible');
            }
          }
        }).addTo(map);

        // Cadrer les données si elles existent
        if (coucheGeoJSON.getLayers().length > 0) {
          map.fitBounds(coucheGeoJSON.getBounds());
        }
      })
      .catch(error => {
        console.error('Erreur GeoJSON :', error);
      });
  </script>

</body>
</html>
